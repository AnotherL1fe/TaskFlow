# ============================================================================
# postgresql.conf — конфигурация TaskFlow для PostgreSQL 15
# Учебный контур. Для production включите SSL и ужесточите pg_hba.conf.
# ============================================================================

# --- подключения ---
listen_addresses = '*'
port = 5432
max_connections = 100
superuser_reserved_connections = 3

# --- память ---
shared_buffers = 128MB
work_mem = 8MB
maintenance_work_mem = 64MB
effective_cache_size = 512MB
dynamic_shared_memory_type = posix

# --- WAL и контрольные точки ---
wal_level = replica
max_wal_size = 1GB
min_wal_size = 128MB
checkpoint_completion_target = 0.9
archive_mode = off               # включить вместе с archive_command для PITR

# --- журналирование ---
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d '
log_connections = on
log_disconnections = on
log_checkpoints = on
log_min_duration_statement = 500
log_statement = 'ddl'
log_timezone = 'UTC'

# --- локаль и время ---
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'

# --- безопасность ---
password_encryption = scram-sha-256

# TLS выключен в учебном контуре, чтобы контейнер запускался без сертификатов.
# Для production:
#   ssl = on
#   ssl_cert_file = '/var/lib/postgresql/server.crt'
#   ssl_key_file  = '/var/lib/postgresql/server.key'
#   ssl_min_protocol_version = 'TLSv1.2'
# и оставьте в pg_hba.conf только строки hostssl.
ssl = off

# --- расширения ---
# shared_preload_libraries = 'pg_stat_statements'
